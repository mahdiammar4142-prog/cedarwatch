services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cedarwatch
      POSTGRES_PASSWORD: cedarwatch
      POSTGRES_DB: cedarwatch
    ports:
      - "5432:5432"
    volumes:
      - cedarwatch_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cedarwatch -d cedarwatch"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cedarwatch_pg:
